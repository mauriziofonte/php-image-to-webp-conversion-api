version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # PHPUnit is capped at 11, and the polyfills must keep supporting
      # PHPUnit 8.5 (the only line that installs on PHP 7.2).
      - dependency-name: phpunit/phpunit
        update-types: ['version-update:semver-major']
      - dependency-name: yoast/phpunit-polyfills
        update-types: ['version-update:semver-major']
    groups:
      composer:
        update-types: [minor, patch]

  - package-ecosystem: composer
    directories:
      - /tools/php-cs-fixer
      - /tools/phpstan
      - /tools/psalm
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      composer-tools:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        update-types: [minor, patch]
