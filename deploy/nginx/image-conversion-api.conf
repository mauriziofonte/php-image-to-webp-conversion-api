# nginx in front of PHP-FPM for the image conversion API. Include it in the
# http block (for example as /etc/nginx/conf.d/image-conversion-api.conf),
# next to upstream.conf, then adapt server_name, the TLS certificate and
# root.
#
# Every request goes to public/index.php, the front controller: no file of
# the installation is ever served. The API answers 404 to unknown paths
# itself. It must be the whole host (or a location of its own that passes
# the original REQUEST_URI): the routes are /v2/convert, /v1/<name>,
# /healthz and /metrics.

server {
    # Add "listen [::]:443 ssl;" (and "[::]:80" below) where IPv6 is enabled.
    listen 443 ssl;
    http2 on;
    server_name images-api.example.com;

    ssl_certificate     /etc/ssl/certs/images-api.example.com.pem;
    ssl_certificate_key /etc/ssl/private/images-api.example.com.key;

    # The application lives in /srv/image-conversion-api; public/ holds
    # index.php only.
    root /srv/image-conversion-api/public;
    server_tokens off;

    # MAX_BODY_BYTES (default 21 MiB) plus room for the multipart framing:
    # a larger body is refused here with 413 before PHP sees it.
    client_max_body_size 22m;

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # Tells the API that the request arrived over TLS (REQUIRE_HTTPS).
        fastcgi_param HTTPS $https if_not_empty;
        # httpoxy: a "Proxy" request header must not become HTTP_PROXY.
        fastcgi_param HTTP_PROXY "";

        # Above CONVERSION_TIME_LIMIT (default 50 s), so that the API answers
        # its own conversion_timeout first.
        fastcgi_read_timeout 60s;
        fastcgi_pass image_conversion_api_fpm;
    }
}

# Plain HTTP only redirects; API keys must not travel in clear text.
server {
    listen 80;
    server_name images-api.example.com;
    return 301 https://$host$request_uri;
}
