; PHP settings of the image conversion API container (FPM and CLI).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off

; MAX_BODY_BYTES and MAX_IMAGE_BYTES (defaults 21 MiB and 20 MiB), and
; V1_MAX_FILES (default 10) for the deprecated /v1 endpoint. Raise them
; with those settings.
post_max_size = 22M
upload_max_filesize = 21M
max_file_uploads = 20

; The conversions run in separate processes with their own limits; the
; worker itself only streams the files.
memory_limit = 256M

; The code never changes inside the image.
opcache.enable = 1
opcache.validate_timestamps = 0

apc.enable_cli = 0
