; PHP-FPM of the image conversion API container: one pool on port 9000,
; run by the image's non-root user, logging to the container's stderr. No
; pid file and no file log, so the root filesystem can be read-only.

[global]
error_log = /proc/self/fd/2
log_level = notice
; JSON log lines of the API pass through unchanged and unsplit.
log_limit = 65536
daemonize = no

[api]
listen = 9000
; The master already runs as the image's user: no user or group switch.

pm = static
; One worker per conversion slot (CONCURRENCY_SLOTS, default 4) plus
; workers for /healthz, /metrics and requests that wait for a slot.
pm.max_children = 8
pm.max_requests = 500

; Above CONVERSION_TIME_LIMIT (default 50 s): the API stops a conversion
; itself first, and answers conversion_timeout.
request_terminate_timeout = 60s

; The configuration comes from the container's environment.
clear_env = no

; LOG_FILE=stderr: the JSON lines of the workers reach the container log as
; they are, without the "child N said into stderr" prefix.
catch_workers_output = yes
decorate_workers_output = no

