# Apache configuration of the integration harness. HARNESS ONLY: it loads
# the modules the .htaccess files rely on and hands PHP to the fpm-apache
# service. Routing and access rules come from the .htaccess files of the
# application, unchanged:
#
# - port 80: the document root is public/ (public/.htaccess), as
#   recommended;
# - port 8080: the document root holds the installation directory itself
#   as /webp-converter/ (the root .htaccess), as 1.x was installed.

ServerRoot "/usr/local/apache2"
Listen 80
Listen 8080
ServerName localhost

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule env_module modules/mod_env.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so

User daemon
Group daemon

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h \"%r\" %>s %b %Dus" harness
CustomLog /proc/self/fd/1 harness

TypesConfig conf/mime.types
# Above MAX_BODY_BYTES: the API refuses larger bodies itself.
LimitRequestBody 104857600

<Directory />
    AllowOverride None
    Require all denied
</Directory>

<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://fpm-apache:9000"
</FilesMatch>

<VirtualHost *:80>
    DocumentRoot "/app/public"
    <Directory "/app/public">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:8080>
    DocumentRoot "/srv/www"
    <Directory "/srv/www">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
