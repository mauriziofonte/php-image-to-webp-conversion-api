; HARNESS ONLY, deliberately hostile: PHP is told to print every error into
; the response, as a careless php.ini would. The API must still answer
; nothing but its own bodies (public/index.php and FrontController turn the
; display off and log the errors instead).
display_errors = On
display_startup_errors = On
html_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/log/harness/php-error.log
; Above MAX_BODY_BYTES, so that the API refuses a larger body itself: an
; error PHP raises before the script runs (a body above post_max_size) is
; printed by display_errors whatever the application does.
post_max_size = 64M
upload_max_filesize = 21M
