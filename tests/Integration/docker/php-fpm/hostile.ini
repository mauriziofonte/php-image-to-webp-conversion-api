; HARNESS ONLY, deliberately hostile: PHP is told to print every error into
; the response, as a careless php.ini would. The API must still answer
; nothing but its own bodies (public/index.php and FrontController turn the
; display off and log the errors instead).
display_errors = On
display_startup_errors = On
html_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/log/harness/php-error.log
; Far below MAX_BODY_BYTES, as on a host whose php.ini was not adapted:
; PHP raises a warning before the script runs for a larger body, which the
; web server configurations must keep out of the response
; (PHP_ADMIN_VALUE in .htaccess and deploy/nginx).
post_max_size = 1M
upload_max_filesize = 1M
